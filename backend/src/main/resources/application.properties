# 毕设演示默认只在本机提供接口，避免局域网设备直接访问对局与模型配置。
server.address=127.0.0.1
# 默认固定为后端应用目录下的 data/experiments，不随启动工作目录变化。
# 可用 WEREWOLF_DATA_DIR 指定绝对目录；打包后默认使用 jar 所在目录。
werewolf.experiments.directory=${WEREWOLF_DATA_DIR:}
# 策略知识库独立保存，默认 backend/data/knowledge/knowledge.json。
werewolf.knowledge.directory=${WEREWOLF_KNOWLEDGE_DIR:}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
